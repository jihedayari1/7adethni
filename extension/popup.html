<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>7adethni</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <!-- HEADER -->
    <header class="hero">
      <div class="hero__pattern" aria-hidden="true"></div>
      <div class="hero__top">
        <div class="brand">
          <span class="brand__mark">7</span>
          <div class="brand__txt">
            <h1>7adethni <span class="flag">🇹🇳</span></h1>
            <p>el AI el tounsi — ekteb bel derja b style ✨</p>
          </div>
        </div>
        <div class="hero__actions">
          <button id="quota" class="chip chip--quota" title="génération mejjeniya">15/15 🎁</button>
          <button id="settingsBtn" class="icon-btn" aria-label="Settings" title="Réglages">⚙️</button>
        </div>
      </div>
    </header>

    <!-- SETTINGS -->
    <section id="settings" class="panel hidden">
      <label>API URL
        <input id="apiUrl" placeholder="http://localhost:9000" />
      </label>
      <button id="saveSettings" class="btn-ghost">Save</button>
    </section>

    <main class="body">
      <!-- FEATURE PILLS (MVP: 3 features, translate = hero) -->
      <nav class="features" id="features" aria-label="Features">
        <button class="pill is-active" data-feat="translate">🔁 Derja</button>
        <button class="pill" data-feat="reply">💬 Reply</button>
        <button class="pill" data-feat="rewrite">✨ Rewrite</button>
      </nav>

      <!-- TONE CHIPS (MVP: 3 tones) -->
      <div class="tones" id="tones" aria-label="Tone">
        <button class="tone is-active" data-tone="normal">3adi</button>
        <button class="tone" data-tone="funny">Morfeh 😄</button>
        <button class="tone" data-tone="formal">Rasmi</button>
      </div>

      <!-- INPUT -->
      <div class="input-wrap">
        <textarea id="input" rows="3" placeholder="Ekteb bel français / english / العربية... w n7awlouhalek l derja 🇹🇳"></textarea>
      </div>

      <!-- CTA -->
      <button id="go" class="cta">
        <span class="cta__label">Génère bel tounsi</span>
        <span class="cta__spark">✨</span>
        <span class="cta__dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>

      <!-- OUTPUT (editable — edits before copy are logged as implicit corrections) -->
      <section id="outBlock" class="out">
        <div class="out__head">
          <span class="out__tag">⭐ Essai</span>
          <span class="out__hint">✏️ tnajjem tbaddel fih 9bal ma t-copi</span>
        </div>
        <div id="output" class="out__card" contenteditable="true" spellcheck="false">3aslema w marhba bik fi 7adethni 🌟 ekteb 7aja w ena n7awwelha l derja tounsiya zina. jarreb taw!</div>
        <div class="out__actions">
          <button id="copy" class="act">📋 Copy</button>
          <button id="regen" class="act">🔄 3awed</button>
          <span class="spacer"></span>
          <button id="fbGood" class="act act--icon" title="Behi">👍</button>
          <button id="fbFix" class="act act--icon" title="Sa77a7">✏️</button>
        </div>
      </section>

      <div id="status" class="status" role="status"></div>
    </main>

    <footer class="foot">7adethni — el AI el tounsi 🇹🇳</footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
